<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>CashConvert</title>
  <style>
    :root {
      --bg:       #FFFFFF;
      --surface:  #F8F8F8;
      --border:   #F0F0F0;
      --text:     #1A1A1A;
      --text2:    #555555;
      --text3:    #AAAAAA;
      --green:    #2D6A4F;
      --green-bg: #E8F5EE;
      --green-text: #1A4030;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width:320px; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:13px; overflow-y:auto; max-height:580px;
    }
    .inner { padding:14px; }

    header { display:flex; align-items:center; gap:10px; padding-bottom:12px; border-bottom:1px solid var(--border); margin-bottom:14px; }
    .logo { width:32px; height:32px; border-radius:8px; background:var(--green-bg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .brand-name { font-size:14px; font-weight:700; }
    .brand-sub  { font-size:11px; color:var(--text3); margin-top:1px; }
    .btn-refresh { margin-left:auto; background:none; border:none; cursor:pointer; font-size:15px; color:var(--text3); padding:4px; border-radius:5px; }
    .btn-refresh:hover { color:var(--green); }

    .section-label { font-size:10px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; }
    .base-picker { display:flex; gap:4px; }
    .base-btn { padding:2px 7px; border-radius:6px; border:1px solid var(--border); font-size:10px; font-weight:600; color:var(--text3); background:var(--bg); cursor:pointer; transition:all 0.12s; }
    .base-btn.active { background:var(--green-bg); border-color:var(--green); color:var(--green-text); }
    .base-btn:hover:not(.active) { border-color:var(--green); color:var(--green); }

    .tiles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px; }
    .tile { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 12px; display:flex; flex-direction:column; }
    .tile.base-tile { border:2px solid var(--green); }
    .tile.full { grid-column:span 2; }
    .tile-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:5px; }
    .tile-flag { font-size:18px; }
    .tile-badge { font-size:9px; font-weight:700; padding:2px 6px; border-radius:8px; background:var(--green-bg); color:var(--green); }
    .tile-rate-lbl { font-size:10px; color:var(--text3); }
    .tile-currency { font-size:11px; font-weight:700; color:var(--text); margin-bottom:1px; }
    .tile-name { font-size:10px; color:var(--text3); flex:1; }
    .tile-amount { font-size:22px; font-weight:700; letter-spacing:-0.5px; margin-top:8px; color:var(--text); }
    .tile-sub { font-size:10px; color:var(--text3); margin-top:2px; }

    .converter { background:var(--surface); border-radius:10px; padding:12px; margin-bottom:10px; }
    .conv-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .conv-row:last-child { margin-bottom:0; }
    .conv-label { font-size:11px; color:var(--text3); width:44px; flex-shrink:0; }
    .conv-control { flex:1; padding:7px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; color:var(--text); background:var(--bg); outline:none; font-family:inherit; }
    .conv-control:focus { border-color:var(--green); }
    .conv-divider { border:none; border-top:1px solid var(--border); margin:8px 0; }
    .conv-result-row { display:flex; align-items:center; justify-content:space-between; padding:3px 0; }
    .conv-result-label { font-size:12px; color:var(--text2); }
    .conv-result-amount { font-size:13px; font-weight:700; color:var(--text); }

    .update-note { font-size:10px; color:var(--text3); text-align:center; padding-bottom:4px; }

    .loading { text-align:center; padding:32px 16px; color:var(--text3); font-size:12px; display:none; }
    .loading.visible { display:block; }
    .spinner { width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; margin:0 auto 10px; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .error { text-align:center; padding:24px 16px; color:var(--text3); font-size:12px; display:none; }
    .error.visible { display:block; }
    .btn-retry { margin-top:10px; padding:7px 16px; background:var(--green); color:white; border:none; border-radius:7px; font-size:12px; font-weight:700; cursor:pointer; }
  </style>
</head>
<body>
<div class="inner">

  <header>
    <div class="logo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="6" width="20" height="13" rx="2" stroke="#2D6A4F" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="3" stroke="#2D6A4F" stroke-width="1.8"/>
        <path d="M2 9h2M20 9h2M2 15h2M20 15h2" stroke="#2D6A4F" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">CashConvert</div>
      <div class="brand-sub">Live exchange rates</div>
    </div>
    <button class="btn-refresh" id="btn-refresh" title="Refresh rates">↺</button>
  </header>

  <div class="loading visible" id="loading">
    <div class="spinner"></div>
    Fetching live rates…
  </div>

  <div class="error" id="error">
    Could not load exchange rates.<br>Check your connection and try again.
    <br><button class="btn-retry" id="btn-retry">Try again</button>
  </div>

  <div id="main-content" style="display:none;">
    <div class="section-label">
      <span id="rates-label">Rates</span>
      <div class="base-picker" id="base-picker"></div>
    </div>
    <div class="tiles" id="tiles"></div>

    <div class="section-label">Converter</div>
    <div class="converter">
      <div class="conv-row">
        <div class="conv-label">Amount</div>
        <input class="conv-control" type="number" id="conv-amount" value="100" min="0" step="any"/>
      </div>
      <div class="conv-row">
        <div class="conv-label">From</div>
        <select class="conv-control" id="conv-from"></select>
      </div>
      <hr class="conv-divider"/>
      <div id="conv-results"></div>
    </div>

    <div class="update-note" id="update-note"></div>
  </div>

</div>
<script src="popup.js"></script>
</body>
</html>
